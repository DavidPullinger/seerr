# Home-theatre fork: build this branch into ghcr.io/<owner>/seerr:home-theatre
# (plus a tag per commit) for the home-server stack to pull.
name: Home theatre image

on:
  push:
    branches:
      - home-theatre
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: home-theatre-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Image name (lowercase, as ghcr.io wants)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            COMMIT_TAG=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:home-theatre
            ${{ env.IMAGE }}:home-theatre-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
